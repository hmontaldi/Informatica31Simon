<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Penal por el Trabajo Invisible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #1B5E3A;
    --bg-2: #164B2E;
    --card: #FFFFFF;
    --ink: #14201A;
    --ink-soft: #4B5D50;
    --accent: #FFC93C;
    --accent-dark: #E0A800;
    --positive: #2FB350;
    --negative: #E63946;
    --neutral: #FFC93C;
    --line: #E1E8E2;
    --scoreboard: #0D2818;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow: 0 12px 28px -10px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-1);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background:
      repeating-linear-gradient(180deg, var(--bg-1) 0px, var(--bg-1) 46px, var(--bg-2) 46px, var(--bg-2) 92px);
  }

  h1, h2, h3, .display, .stamp-font {
    font-family: 'Bebas Neue', sans-serif;
    margin: 0;
    letter-spacing: 0.02em;
  }

  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    padding: 18px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- Header ---------- */
  header { padding-top: 4px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  header h1 {
    font-size: clamp(30px, 9vw, 38px);
    color: #FFFFFF;
    line-height: 1.05;
    margin-top: 4px;
  }

  header p {
    margin-top: 6px;
    color: rgba(255,255,255,0.82);
    font-size: 14.5px;
    line-height: 1.45;
    font-weight: 500;
  }

  /* ---------- Progress dots ---------- */
  .progress { display: flex; gap: 6px; }
  .progress .dot {
    flex: 1;
    height: 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.22);
  }
  .progress .dot.filled { background: var(--accent); }
  .progress .dot.current { background: #ffffff; }

  /* ---------- Scoreboard ---------- */
  .scoreboard {
    background: var(--scoreboard);
    border: 3px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .scoreboard .label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    color: #DCEFE0;
    font-size: 13px;
  }
  .scoreboard .digits {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  /* ---------- Goal scene ---------- */
  .goal-card {
    background: linear-gradient(180deg, #2E8B54, #1E6B3F);
    border-radius: var(--radius-lg);
    padding: 14px 10px 8px;
    box-shadow: var(--shadow);
  }

  .goal-scene {
    position: relative;
    height: 148px;
    max-width: 260px;
    margin: 0 auto;
  }

  .goal-frame {
    position: absolute;
    left: 50%;
    top: 4px;
    transform: translateX(-50%);
    width: 210px;
    height: 88px;
    border: 6px solid #fff;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.4) 0 1px, transparent 1px 9px);
    box-shadow: inset 0 -8px 16px rgba(0,0,0,0.18);
  }

  .goal-line {
    position: absolute;
    left: 50%;
    top: 92px;
    transform: translateX(-50%);
    width: 230px;
    height: 3px;
    background: rgba(255,255,255,0.65);
    border-radius: 2px;
  }

  .keeper {
    position: absolute;
    left: 50%;
    top: 58px;
    transform: translate(-50%, 0);
    font-size: 28px;
    transition: transform 0.5s ease;
    z-index: 3;
  }

  .ball {
    position: absolute;
    left: 50%;
    bottom: 4px;
    transform: translate(-50%, 0) scale(1);
    font-size: 26px;
    transition: transform 0.55s cubic-bezier(.25,.85,.3,1.15);
    z-index: 4;
  }

  .result-stamp {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%,-50%) scale(0);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.06em;
    text-shadow: 0 3px 8px rgba(0,0,0,0.45);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
    z-index: 5;
    white-space: nowrap;
  }
  .result-stamp.show { transform: translate(-50%,-50%) scale(1); }
  .result-stamp.gol { color: #ffffff; }
  .result-stamp.atajada { color: #ffe3e3; }
  .result-stamp.palo { color: var(--accent); }

  .shot-caption {
    text-align: center;
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-top: 2px;
  }

  /* ---------- Scenario card ---------- */
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: cardIn 0.4s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scenario-tag {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: #ffffff;
    background: var(--positive);
    padding: 3px 12px;
    border-radius: 999px;
    width: fit-content;
  }

  .scenario-text {
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    font-weight: 500;
  }

  .scenario-question {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.15;
  }

  .options { display: flex; flex-direction: column; gap: 9px; margin-top: 2px; }

  .option-btn {
    text-align: left;
    border: 2px solid var(--line);
    background: #FAFBF9;
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 15px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    line-height: 1.35;
  }

  .option-btn:active { transform: scale(0.98); }
  .option-btn:hover { border-color: var(--accent-dark); background: #FFF8E6; }
  .option-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .option-btn.chosen-positive { border-color: var(--positive); background: #E9F8ED; }
  .option-btn.chosen-negative { border-color: var(--negative); background: #FCEAEB; }
  .option-btn.chosen-neutral  { border-color: var(--accent-dark); background: #FFF6DC; }
  .option-btn[disabled] { cursor: default; }
  .option-btn[disabled]:not(.chosen-positive):not(.chosen-negative):not(.chosen-neutral) { opacity: 0.4; }

  .feedback {
    display: none;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    padding: 10px 12px;
    border-radius: var(--radius-md);
  }
  .feedback.show { display: block; }
  .feedback.positive { background: #E9F8ED; color: #1E7A3B; }
  .feedback.negative { background: #FCEAEB; color: #A5222B; }
  .feedback.neutral   { background: #FFF6DC; color: #8A6800; }

  .next-btn {
    margin-top: 2px;
    align-self: flex-end;
    background: var(--accent);
    color: #14201A;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 0.04em;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
  }
  .next-btn:active { transform: scale(0.97); }

  /* ---------- Intro / end screens ---------- */
  .center-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: cardIn 0.5s ease both;
  }

  .center-card .headline {
    font-size: clamp(24px, 8vw, 30px);
    color: var(--ink);
    line-height: 1.08;
  }

  .center-card p { color: var(--ink-soft); font-size: 15px; line-height: 1.5; font-weight: 500; }

  .primary-btn {
    background: var(--accent);
    color: #14201A;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 0.04em;
    padding: 14px 20px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 18px -6px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
  }
  .primary-btn:active { transform: scale(0.97); }

  .result-badge { font-size: 46px; line-height: 1; }

  .breakdown { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
  .breakdown .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 600;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 6px;
  }
  .breakdown .row span.delta.pos { color: var(--positive); font-weight: 800; }
  .breakdown .row span.delta.neg { color: var(--negative); font-weight: 800; }
  .breakdown .row span.delta.zero { color: var(--ink-soft); font-weight: 800; }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  /* ======================= DATA ======================= */
  /* type controla la animacion: positive -> gol | neutral -> palo | negative -> atajada */

  const SCENARIOS = [
    {
      tag: "Tiro 1",
      text: "Tu mamá dejó todo listo antes de las 7. Nadie se lo pidió.",
      question: "¿Qué onda con eso?",
      options: [
        { text: "Es lo normal, para eso está.", points: -12, type: "negative", feedback: "Naturalizarlo lo mantiene invisible." },
        { text: "Le agradezco y ofrezco ayudar mañana.", points: 15, type: "positive", feedback: "Nombrarlo es el primer paso." },
        { text: "Nunca lo había pensado.", points: 5, type: "neutral", feedback: "Darte cuenta ya suma." }
      ]
    },
    {
      tag: "Tiro 2",
      text: "Tu abuela cuida a tus hermanos todos los días, gratis.",
      question: "Alguien dice \"no hace nada\". ¿Qué respondés?",
      options: [
        { text: "Tiene razón, no es trabajo real.", points: -15, type: "negative", feedback: "Cuidar también es trabajar." },
        { text: "Sin ella, alguien dejaría de laburar o pagarían niñera.", points: 15, type: "positive", feedback: "Ese cuidado vale plata real." },
        { text: "Prefiero no meterme.", points: -3, type: "neutral", feedback: "Quedarte callado también pesa." }
      ]
    },
    {
      tag: "Tiro 3",
      text: "Siempre la misma persona se acuerda de turnos, pagos y cumples.",
      question: "¿Cómo llamás a eso?",
      options: [
        { text: "Ser organizado, no es para tanto.", points: -10, type: "negative", feedback: "Eso cansa aunque no se vea." },
        { text: "Carga mental: es trabajo igual.", points: 15, type: "positive", feedback: "Exacto, pensar todo el tiempo agota." },
        { text: "Nunca me fijé quién lo hace.", points: 3, type: "neutral", feedback: "Prestale atención esta semana." }
      ]
    },
    {
      tag: "Tiro 4",
      text: "Tu papá bajó sus horas de laburo pago para cuidar a tu tío.",
      question: "¿Qué opinás?",
      options: [
        { text: "Mala decisión, va a perder plata.", points: -10, type: "negative", feedback: "El cuidado también sostiene la casa." },
        { text: "Ese esfuerzo debería reconocerse.", points: 15, type: "positive", feedback: "El cuidado sostiene tanto como el sueldo." },
        { text: "No tengo opinión, es tema de ellos.", points: 0, type: "neutral", feedback: "Igual, pensalo un cachito." }
      ]
    },
    {
      tag: "Tiro 5",
      text: "Cocinaste, cuidaste a tu hermano y lavaste los platos toda la semana. Nadie dijo nada.",
      question: "¿Cómo lo manejás?",
      options: [
        { text: "Da lo mismo, no digo nada.", points: -8, type: "negative", feedback: "Tu esfuerzo también cuenta." },
        { text: "Se lo cuento a mi familia, tranqui.", points: 15, type: "positive", feedback: "Nombrarlo lo hace visible." },
        { text: "Me da bronca pero me lo guardo.", points: -2, type: "neutral", feedback: "¿Y si lo decís en vez de guardarlo?" }
      ]
    }
  ];

  const START_SCORE = 50;
  const MAX_SCORE = 100;
  const MIN_SCORE = 0;

  /* ======================= STATE ======================= */

  let state = { current: 0, score: START_SCORE, history: [], shuffled: [] };

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function clampScore(v){ return Math.max(MIN_SCORE, Math.min(MAX_SCORE, v)); }

  /* ======================= RENDER HELPERS ======================= */

  const app = document.getElementById("app");

  function el(tag, attrs, children){
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => { if (c) node.appendChild(c); });
    return node;
  }

  function renderHeader(subtitle){
    return el("header", null, [
      el("div", { class: "eyebrow" }, [document.createTextNode("Definición por penales")]),
      el("h1", null, [document.createTextNode("⚽ Penal al Trabajo Invisible")]),
      el("p", null, [document.createTextNode(subtitle)])
    ]);
  }

  function progressBar(){
    const wrap = el("div", { class: "progress" });
    for (let i = 0; i < SCENARIOS.length; i++){
      let cls = "dot";
      if (i < state.current) cls += " filled";
      else if (i === state.current) cls += " current";
      wrap.appendChild(el("div", { class: cls }));
    }
    return wrap;
  }

  function scoreboardWidget(score){
    const wrap = el("div", { class: "scoreboard" });
    wrap.appendChild(el("div", { class: "label" }, [document.createTextNode("RECONOCIMIENTO")]));
    wrap.appendChild(el("div", { class: "digits" }, [document.createTextNode(score + " / 100")]));
    return wrap;
  }

  function goalScene(){
    const goalCard = el("div", { class: "goal-card" });
    const scene = el("div", { class: "goal-scene" });
    scene.appendChild(el("div", { class: "goal-frame" }));
    scene.appendChild(el("div", { class: "goal-line" }));
    scene.appendChild(el("div", { class: "keeper", id: "keeper" }, [document.createTextNode("🧤")]));
    scene.appendChild(el("div", { class: "ball", id: "ball" }, [document.createTextNode("⚽")]));
    scene.appendChild(el("div", { class: "result-stamp", id: "stamp" }));
    goalCard.appendChild(scene);
    goalCard.appendChild(el("div", { class: "shot-caption", id: "shotCaption" }, [document.createTextNode("Elegí tu respuesta y pateá.")]));
    return goalCard;
  }

  function takeShot(outcomeType){
    const lanes = [-60, 0, 60];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const ball = document.getElementById("ball");
    const keeper = document.getElementById("keeper");
    const stamp = document.getElementById("stamp");
    const caption = document.getElementById("shotCaption");
    if (!ball) return;

    stamp.classList.remove("show", "gol", "atajada", "palo");

    requestAnimationFrame(() => {
      if (outcomeType === "positive"){
        const dive = lane >= 0 ? -70 : 70;
        keeper.style.transform = `translate(calc(-50% + ${dive}px), -6px)`;
        ball.style.transform = `translate(calc(-50% + ${lane}px), -84px) scale(0.68)`;
        stamp.textContent = "¡GOOOL!";
        stamp.classList.add("gol");
        caption.textContent = "La arqueadora se tiró para el otro lado.";
      } else if (outcomeType === "negative"){
        keeper.style.transform = `translate(calc(-50% + ${lane}px), -8px)`;
        ball.style.transform = `translate(calc(-50% + ${lane}px), -44px) scale(0.85)`;
        stamp.textContent = "ATAJADA";
        stamp.classList.add("atajada");
        caption.textContent = "Le tiraste directo a las manos.";
      } else {
        const postLane = lane === 0 ? 90 : (lane > 0 ? 90 : -90);
        keeper.style.transform = `translate(calc(-50% + ${(-postLane * 0.35).toFixed(0)}px), -4px)`;
        ball.style.transform = `translate(calc(-50% + ${postLane}px), -58px) scale(0.75)`;
        stamp.textContent = "AL PALO";
        stamp.classList.add("palo");
        caption.textContent = "Pegó en el palo, no fue ni gol ni atajada.";
      }
      setTimeout(() => stamp.classList.add("show"), 300);
    });
  }

  /* ======================= SCREENS ======================= */

  function renderIntro(){
    app.innerHTML = "";
    app.appendChild(renderHeader("¿Cuánto vale el esfuerzo que sostiene tu casa? Definición por penales."));

    const card = el("div", { class: "center-card" });
    card.appendChild(el("div", { class: "headline display" }, [document.createTextNode("Hay trabajo que no se ve. Vos decidís si lo metés o lo tapás.")]));
    card.appendChild(el("p", null, [document.createTextNode(
      "5 tiros, 5 situaciones reales de tu casa. Elegís una respuesta y pateás. Cada elección suma o resta puntos al marcador."
    )]));
    const btn = el("button", { class: "primary-btn" }, [document.createTextNode("¡ARRANCAR! ⚽")]);
    btn.addEventListener("click", () => {
      state = { current: 0, score: START_SCORE, history: [], shuffled: [] };
      startScenario();
    });
    card.appendChild(btn);
    app.appendChild(card);
    app.appendChild(el("footer", { class: "note" }, [document.createTextNode("Situaciones de familias en Argentina.")]));
  }

  function startScenario(){
    const sc = SCENARIOS[state.current];
    state.shuffled = shuffle(sc.options);
    renderScenario();
  }

  function renderScenario(){
    app.innerHTML = "";
    app.appendChild(renderHeader("Elegí la respuesta y mirá adónde va la pelota."));
    app.appendChild(progressBar());
    app.appendChild(scoreboardWidget(state.score));
    app.appendChild(goalScene());

    const sc = SCENARIOS[state.current];
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "scenario-tag" }, [document.createTextNode(sc.tag + " de " + SCENARIOS.length)]));
    card.appendChild(el("div", { class: "scenario-text" }, [document.createTextNode(sc.text)]));
    card.appendChild(el("div", { class: "scenario-question" }, [document.createTextNode(sc.question)]));

    const optWrap = el("div", { class: "options" });
    const feedbackBox = el("div", { class: "feedback" });
    const nextBtn = el("button", { class: "next-btn" }, [document.createTextNode(
      state.current === SCENARIOS.length - 1 ? "VER RESULTADO" : "SIGUIENTE"
    )]);

    let answered = false;

    state.shuffled.forEach((opt) => {
      const b = el("button", { class: "option-btn" }, [document.createTextNode(opt.text)]);
      b.addEventListener("click", () => {
        if (answered) return;
        answered = true;

        Array.from(optWrap.children).forEach(child => child.setAttribute("disabled", "true"));
        const cls = opt.type === "positive" ? "chosen-positive" : opt.type === "negative" ? "chosen-negative" : "chosen-neutral";
        b.classList.add(cls);

        state.score = clampScore(state.score + opt.points);
        state.history.push({ tag: sc.tag, choiceText: opt.text, points: opt.points });

        feedbackBox.className = "feedback show " + opt.type;
        const sign = opt.points > 0 ? "+" : "";
        feedbackBox.textContent = `${sign}${opt.points} pts · ${opt.feedback}`;

        const scoreboards = app.querySelectorAll(".scoreboard");
        if (scoreboards.length){
          const fresh = scoreboardWidget(state.score);
          scoreboards[0].replaceWith(fresh);
        }

        takeShot(opt.type);

        nextBtn.style.display = "inline-flex";
      });
      optWrap.appendChild(b);
    });

    nextBtn.style.display = "none";
    nextBtn.addEventListener("click", () => {
      if (state.current < SCENARIOS.length - 1){
        state.current += 1;
        startScenario();
      } else {
        renderEnd();
      }
    });

    card.appendChild(optWrap);
    card.appendChild(feedbackBox);
    card.appendChild(nextBtn);
    app.appendChild(card);
  }

  function resultCopy(score){
    if (score <= 35){
      return { badge: "🙈", title: "Errado al arco todavía", text: "Hoy te costó ver el esfuerzo que sostiene tu casa. Probá nombrarlo la próxima vez que alguien haga algo por vos sin pedirlo." };
    } else if (score <= 70){
      return { badge: "🥅", title: "Empatando el partido", text: "Ya notás el esfuerzo que antes no veías. Ahora falta agradecerlo o ayudar en algo concreto." };
    } else {
      return { badge: "🏆", title: "Definición ganada", text: "Reconocés que cuidar y sostener una casa es trabajo, tenga sueldo o no. Ese es el primer paso para repartirlo mejor." };
    }
  }

  function renderEnd(){
    app.innerHTML = "";
    app.appendChild(renderHeader("Así terminó tu tanda de penales."));
    app.appendChild(scoreboardWidget(state.score));

    const result = resultCopy(state.score);
    const card = el("div", { class: "center-card" });
    card.appendChild(el("div", { class: "result-badge" }, [document.createTextNode(result.badge)]));
    card.appendChild(el("div", { class: "headline display" }, [document.createTextNode(result.title)]));
    card.appendChild(el("p", null, [document.createTextNode(result.text)]));

    const breakdown = el("div", { class: "breakdown" });
    state.history.forEach(h => {
      const row = el("div", { class: "row" });
      const label = el("span", null, [document.createTextNode(h.tag)]);
      const deltaCls = h.points > 0 ? "pos" : h.points < 0 ? "neg" : "zero";
      const sign = h.points > 0 ? "+" : "";
      const delta = el("span", { class: "delta " + deltaCls }, [document.createTextNode(sign + h.points)]);
      row.appendChild(label);
      row.appendChild(delta);
      breakdown.appendChild(row);
    });
    card.appendChild(breakdown);

    const retryBtn = el("button", { class: "primary-btn" }, [document.createTextNode("VOLVER A PATEAR")]);
    retryBtn.addEventListener("click", renderIntro);
    card.appendChild(retryBtn);

    app.appendChild(card);
    app.appendChild(el("footer", { class: "note" }, [document.createTextNode("El orden de las respuestas cambia en cada partida.")]));
  }

  /* ======================= INIT ======================= */
  renderIntro();
})();
</script>
</body>
</html>
