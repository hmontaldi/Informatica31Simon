<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelo de Reflejos</title>
<style>
  :root{
    --bg: #0b0f14;
    --left-idle: #0f4c4a;
    --left-bright: #14e0c9;
    --right-idle: #4c2a0f;
    --right-bright: #ff9d3d;
    --false: #e0304a;
    --gold: #ffd166;
    --ink: #f4f4f0;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .stage{
    display:flex; flex-direction:column; height:100vh; width:100vw;
  }
  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 22px;
    background:#05070a;
    border-bottom: 2px solid #1a2129;
    z-index:5;
  }
  .score{
    font-size: clamp(14px, 2.2vw, 20px);
    font-weight:700;
    letter-spacing: 0.03em;
    display:flex; align-items:center; gap:8px;
  }
  .score .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .score.left .dot{ background:var(--left-bright); }
  .score.right .dot{ background:var(--right-bright); }
  .message{
    flex:1;
    text-align:center;
    font-size: clamp(16px, 2.6vw, 26px);
    font-weight:800;
    letter-spacing:0.02em;
    text-transform:uppercase;
    transition: color .15s ease;
  }
  .message.live{ color: var(--gold); animation: pulseText .5s ease infinite alternate; }
  .message.false{ color: var(--false); }
  @keyframes pulseText{ from{opacity:.55;} to{opacity:1;} }

  .arena{
    flex:1; display:flex; position:relative;
  }
  .zona{
    flex:1; border:none; outline:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    font-family:inherit;
    transition: background .12s ease, transform .1s ease;
    position:relative;
  }
  .zona-left{ background: var(--left-idle); border-right: 2px solid #1a2129; }
  .zona-right{ background: var(--right-idle); }

  .zona-label{
    font-size: clamp(20px, 4.2vw, 40px);
    font-weight:900;
    letter-spacing: 0.04em;
  }
  .zona-hint{
    font-size: clamp(12px, 1.6vw, 16px);
    opacity:.65;
    font-weight:600;
  }
  .reaction{
    font-size: clamp(14px, 2vw, 20px);
    font-weight:700;
    font-variant-numeric: tabular-nums;
    min-height: 1.4em;
  }

  .zona.live{ filter: saturate(1.3); }
  .zona-left.live{ background: #146b64; }
  .zona-right.live{ background: #6b3a14; }

  .zona.win{ background: var(--gold) !important; color:#1a1400; transform: scale(1.01); }
  .zona.win .zona-label{ color:#1a1400; }
  .zona.lose{ background:#161c22 !important; opacity:.55; }

  .zona.falseStart{ background: var(--false) !important; animation: shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-8px); }
    75%{ transform: translateX(8px); }
  }

  .overlay-start{
    position:absolute; inset:0; z-index:10;
    background: rgba(5,7,10,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding: 24px;
  }
  .overlay-start h1{
    margin:0; font-size: clamp(24px, 5vw, 44px); font-weight:900; letter-spacing:0.02em;
  }
  .overlay-start p{
    margin:0; opacity:.75; max-width: 520px; font-size: clamp(13px,1.8vw,16px);
  }
  .btn-primary{
    margin-top: 8px;
    padding: 14px 34px;
    font-size: clamp(15px,2vw,18px);
    font-weight:800;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background: var(--gold);
    color: #1a1400;
    border:none; border-radius: 999px;
    cursor:pointer;
  }
  .btn-primary:active{ transform: scale(.97); }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .message.live{ animation:none; }
    .zona.falseStart{ animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="status-bar">
    <div class="score left"><span class="dot"></span><span id="scoreLeft">0</span> Jugador 1</div>
    <div class="message" id="message">Toca "Empezar ronda" para jugar</div>
    <div class="score right">Jugador 2 <span id="scoreRight">0</span><span class="dot"></span></div>
  </div>

  <div class="arena">
    <button class="zona zona-left" id="left">
      <span class="zona-label">JUGADOR 1</span>
      <span class="zona-hint">Toca cuando aparezca "¡YA!"</span>
      <span class="reaction" id="reactionLeft"></span>
    </button>
    <button class="zona zona-right" id="right">
      <span class="zona-label">JUGADOR 2</span>
      <span class="zona-hint">Toca cuando aparezca "¡YA!"</span>
      <span class="reaction" id="reactionRight"></span>
    </button>

    <div class="overlay-start" id="overlay">
      <h1>Duelo de Reflejos</h1>
      <p>Cada jugador se ubica de su lado de la pantalla. Cuando el mensaje cambie a "¡YA!", el primero en tocar su mitad gana la ronda. Si tocás antes de tiempo, es salida en falso.</p>
      <button class="btn-primary" id="startBtn">Empezar ronda</button>
    </div>
  </div>
</div>

<script>
  const leftZone = document.getElementById('left');
  const rightZone = document.getElementById('right');
  const message = document.getElementById('message');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreLeftEl = document.getElementById('scoreLeft');
  const scoreRightEl = document.getElementById('scoreRight');
  const reactionLeftEl = document.getElementById('reactionLeft');
  const reactionRightEl = document.getElementById('reactionRight');

  let state = 'idle'; // idle | waiting | live | resolved
  let timeoutId = null;
  let goTime = 0;
  const scores = { left: 0, right: 0 };

  function clearZoneClasses(){
    [leftZone, rightZone].forEach(z => {
      z.classList.remove('live','win','lose','falseStart');
    });
  }

  function setMessage(text, cls){
    message.textContent = text;
    message.className = 'message' + (cls ? ' ' + cls : '');
  }

  function startRound(){
    state = 'waiting';
    clearZoneClasses();
    reactionLeftEl.textContent = '';
    reactionRightEl.textContent = '';
    setMessage('Prepárense...', '');
    const delay = 1200 + Math.random() * 2600;
    timeoutId = setTimeout(() => {
      state = 'live';
      goTime = performance.now();
      leftZone.classList.add('live');
      rightZone.classList.add('live');
      setMessage('¡YA!', 'live');
    }, delay);
  }

  function handlePress(side){
    if(state === 'waiting'){
      clearTimeout(timeoutId);
      state = 'falseStart';
      const zone = side === 'left' ? leftZone : rightZone;
      zone.classList.add('falseStart');
      setMessage((side === 'left' ? 'Jugador 1' : 'Jugador 2') + ' salió antes de tiempo', 'false');
      setTimeout(startRound, 1600);
      return;
    }
    if(state === 'live'){
      const reactionMs = Math.round(performance.now() - goTime);
      state = 'resolved';
      scores[side]++;
      scoreLeftEl.textContent = scores.left;
      scoreRightEl.textContent = scores.right;

      const winZone = side === 'left' ? leftZone : rightZone;
      const loseZone = side === 'left' ? rightZone : leftZone;
      const winReactionEl = side === 'left' ? reactionLeftEl : reactionRightEl;

      clearZoneClasses();
      winZone.classList.add('win');
      loseZone.classList.add('lose');
      winReactionEl.textContent = reactionMs + ' ms';

      setMessage((side === 'left' ? 'Jugador 1' : 'Jugador 2') + ' gana la ronda — ' + reactionMs + ' ms', 'win');
      setTimeout(startRound, 2200);
    }
  }

  leftZone.addEventListener('click', () => handlePress('left'));
  rightZone.addEventListener('click', () => handlePress('right'));

  startBtn.addEventListener('click', () => {
    overlay.classList.add('hidden');
    startRound();
  });
</script>
</body>
</html>
