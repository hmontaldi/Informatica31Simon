<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informática aplicada a la gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef1ee; --card:#fbfbf8; --ink:#1f2e2b; --ink-soft:#5c6a64;
    --gold:#b8902f; --teal:#2c6e63; --rule:#d3d9d2;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0);
    background-size:14px 14px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4', serif; color:var(--ink);
    padding: 28px 16px;
  }
  .cover{
    width:100%; max-width: 560px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 44px 34px 36px;
    text-align:center;
    position:relative;
    box-shadow: 0 24px 50px rgba(20,30,25,0.14), 0 2px 0 rgba(20,30,25,0.04);
  }
  .cover::before, .cover::after{
    content:""; position:absolute; left:0; right:0; height:10px;
    background-image: linear-gradient(135deg, var(--paper) 25%, transparent 25%),
                       linear-gradient(225deg, var(--paper) 25%, transparent 25%);
    background-size:14px 14px;
  }
  .cover::before{ top:-1px; }
  .cover::after{ bottom:-1px; transform: scaleY(-1); }

  .logo{
    width: 132px; height: 132px; border-radius:50%;
    margin: 0 auto 22px; display:block;
    box-shadow: 0 8px 20px rgba(20,30,25,0.12);
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px;
  }

  h1{
    font-size: 34px; line-height:1.18; font-weight:700; margin: 0 0 8px;
    color: var(--ink);
  }
  .curso{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size: 16px;
    letter-spacing:.06em; color: var(--teal); text-transform:uppercase;
    margin: 4px 0 26px;
  }

  hr.rule{ border:none; border-top:1px dashed var(--rule); margin: 22px 0; }

  .profesor{
    font-size: 18px; margin: 0 0 4px;
  }
  .profesor .label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;
  }
  .profesor strong{ font-weight:700; }

  .escuela{
    margin-top: 22px; font-size: 14px; color: var(--ink-soft); line-height:1.5;
  }
  .escuela strong{ color: var(--ink); font-weight:600; }

  .enter-btn{
    display:inline-flex; align-items:center; gap:9px;
    margin-top: 26px;
    background: var(--ink); color: var(--card); text-decoration:none;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size: 14px;
    letter-spacing:.08em; text-transform:uppercase;
    padding: 14px 28px; border-radius: 40px;
    box-shadow: 0 10px 20px rgba(20,30,25,0.18);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .enter-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 26px rgba(20,30,25,0.24);
    opacity: 0.92;
  }
  .enter-btn:active{ transform: translateY(0) scale(0.98); }
  .enter-btn .arrow{ transition: transform .15s ease; }
  .enter-btn:hover .arrow{ transform: translateX(4px); }
  @keyframes pulse{
    0%, 100%{ box-shadow: 0 10px 20px rgba(20,30,25,0.18); }
    50%{ box-shadow: 0 10px 24px rgba(184,144,47,0.35); }
  }

  footer{
    margin-top: 22px; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.1em; color: var(--ink-soft); text-transform:uppercase;
  }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
