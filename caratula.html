<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carátula — Informática Aplicada a la Gestión</title>
<style>
  @page { margin: 0; size: A4; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }
  .hoja {
    width: 210mm;
    height: 297mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #F5EFE3 0%, #FBF6ED 50%, #F8ECEA 100%);
    box-sizing: border-box;
    position: relative;
  }
  .marco {
    position: absolute;
    top: 30px; left: 30px; right: 30px; bottom: 30px;
    border: 3px solid #CDA957;
    border-radius: 24px;
    opacity: 0.55;
  }
  .marco-interno {
    position: absolute;
    top: 42px; left: 42px; right: 42px; bottom: 42px;
    border: 1px solid #7A9CBB;
    border-radius: 18px;
    opacity: 0.5;
  }
  .contenido {
    text-align: center;
    padding: 40px;
    width: 100%;
  }
  .logo-escudo {
    width: 230px;
    height: auto;
    margin: 0 auto 26px auto;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(23,36,48,0.18));
  }
  .escuela {
    font-size: 24px;
    color: #182430;
    letter-spacing: 0.8px;
    margin: 0 0 8px 0;
    text-transform: uppercase;
    font-weight: bold;
  }
  .curso {
    font-size: 21px;
    color: #7A9CBB;
    margin: 0 0 46px 0;
  }
  .materia {
    font-size: 60px;
    font-weight: bold;
    color: #182430;
    margin: 0 0 12px 0;
    line-height: 1.18;
  }
  .subtitulo {
    font-size: 26px;
    color: #B96B72;
    margin: 0 0 54px 0;
  }
  .card-qr {
    background: white;
    border: 1px solid #EAD9B0;
    border-radius: 26px;
    padding: 46px 56px;
    box-shadow: 0 14px 40px rgba(205,169,87,0.22);
    display: inline-block;
  }
  .card-qr img {
    width: 340px;
    height: 340px;
    display: block;
    margin: 0 auto;
  }
  .url {
    margin-top: 24px;
    font-size: 26px;
    font-weight: bold;
    color: #182430;
    letter-spacing: 0.4px;
  }
  .indicacion {
    margin-top: 12px;
    font-size: 17px;
    color: #7A9CBB;
  }
  .footer-caratula {
    margin-top: 54px;
    font-size: 21px;
    color: #182430;
  }
  .footer-caratula strong { color: #B96B72; }
  .linea {
    width: 100px;
    height: 4px;
    background: #CDA957;
    border-radius: 2px;
    margin: 36px auto;
  }
</style>
</head>
<body>
<div class="hoja">
<div class="marco"></div>
<div class="marco-interno"></div>
<div class="contenido">

  <img class="logo-escudo" src="logo_sb_recortado.png" alt="Escudo Escuela N° 4-084 Libertador Simón Bolívar">
  <p class="escuela">Escuela N° 4-084</p>
  <p class="curso">3° 1° &middot; Bachiller de Economía</p>

  <h1 class="materia">Informática Aplicada<br>a la Gestión</h1>
  <p class="subtitulo">Carpeta digital</p>

  <div class="card-qr">
    <img src="qr_informatica31simon.png" alt="Código QR de acceso a la carpeta digital">
    <p class="url">informatica31simon.vercel.app</p>
    <p class="indicacion">Escaneá el código para acceder</p>
  </div>

  <div class="linea"></div>

  <p class="footer-caratula"><strong>Profesor:</strong> Humberto Montaldi</p>

</div>
</div>
</body>
</html>
